<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BPS Data Downloader</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--mut:#94a3b8;--bd:#334155;--ac:#38bdf8;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#e2e8f0}
header{background:var(--bg);padding:14px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:18px}.sub{color:var(--mut);font-size:12px;font-weight:400}
.state{margin-top:8px;font-size:12px;color:var(--mut)}.state b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:60px;z-index:4}
nav button{background:transparent;border:1px solid var(--bd);color:var(--mut);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px}
nav button.on{background:var(--ac);color:#04293b;border-color:var(--ac);font-weight:600}
main{padding:20px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{background:#0b1220;border:1px solid var(--bd);color:#e2e8f0;padding:8px 10px;border-radius:8px;font-size:13px}
input[type=text],input[type=password]{min-width:240px}
button.act{background:var(--ac);color:#04293b;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
button.gho{background:transparent;border:1px solid var(--bd);color:#e2e8f0;padding:7px 12px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.clk:hover{background:#243044;cursor:pointer}
.pill{display:inline-block;background:#0b1220;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--mut)}
.muted{color:var(--mut)}.h2{font-size:15px;margin:0 0 10px}
.cat{margin:14px 0 6px;color:var(--ac);font-weight:600;font-size:13px}
.scroll{max-height:62vh;overflow:auto;border:1px solid var(--bd);border-radius:10px}
a{color:var(--ac)}.hide{display:none}.note{font-size:12px;color:var(--mut);margin-top:6px}
.banner{background:#3b2a12;border:1px solid #92610e;color:#fde68a;padding:12px 16px;border-radius:10px;margin-bottom:16px}
@media(max-width:700px){header{position:static}nav{position:static;overflow-x:auto;flex-wrap:nowrap}main{padding:14px}input[type=text],input[type=password]{min-width:180px}.scroll{max-height:68vh}th,td{padding:7px 6px}}
</style></head><body>
<header><h1>📊 BPS Data Downloader <span class="sub">webapi.bps.go.id · runs entirely in your browser</span></h1>
<div class="state" id="state">No subject selected</div></header>
<nav id="nav" aria-label="Data tools"></nav>
<main>
<div id="keybanner"></div>
<div id="v-subjects" class="view"></div>
<div id="v-vars" class="view hide"></div>
<div id="v-years" class="view hide"></div>
<div id="v-pubs" class="view hide"></div>
<div id="v-static" class="view hide"></div>
<div id="v-settings" class="view hide"></div>
</main>
<script>
const BASE='https://webapi.bps.go.id/v1/api';
const CSV_COLS=['var_id','variable','unit','vervar_id','vervar','turvar_id','turvar','year_id','year','period_id','period','value'];
const S={subject:null,subjectTitle:null,var:null,varTitle:null,subjects:[],vars:[]};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getKey=()=>localStorage.getItem('bps_key')||'';
const DOMAIN=()=>localStorage.getItem('bps_domain')||'0000';
const LANG=()=>localStorage.getItem('bps_lang')||'ind';
function clean(s){if(s==null)return s;s=String(s).replace(/<[^>]+>/g,'');const t=document.createElement('textarea');t.innerHTML=s;return t.value.replace(/\s+/g,' ').trim();}

async function apiList(model,filt){const k=getKey();if(!k)throw new Error('No API key set — open the Settings tab and paste your free BPS key.');
 const seg=filt?filt+'/':'';let out=[],page=1;
 while(true){const url=`${BASE}/list/model/${model}/lang/${LANG()}/domain/${DOMAIN()}/${seg}perpage/100/page/${page}/key/${k}/`;
  const r=await fetch(url);if(!r.ok)throw new Error('BPS API HTTP '+r.status+(r.status===403?' (blocked/invalid key — check Settings, or retry in a moment)':''));
  const d=await r.json();const data=d.data;
  if(!(Array.isArray(data)&&data.length>1&&data[1]))break;
  out=out.concat(data[1]);if(page>=(data[0].pages||1))break;page++;}
 return out;}
async function apiData(v,th){const k=getKey();const url=`${BASE}/list/model/data/lang/${LANG()}/domain/${DOMAIN()}/var/${v}/th/${th}/key/${k}/`;
 const r=await fetch(url);if(!r.ok)throw new Error('BPS API HTTP '+r.status);return r.json();}

function decodeRows(d){if(d['data-availability']!=='available')return [];
 const V=d.var[0],vid=String(V.val),unit=clean(V.unit||''),vlab=clean(V.label||'');
 const vervar=d.vervar||[],turvar=(d.turvar&&d.turvar.length?d.turvar:[{val:'',label:''}]);
 const tahun=d.tahun||[],turtahun=(d.turtahun&&d.turtahun.length?d.turtahun:[{val:'',label:''}]);
 const dc=d.datacontent||{},rows=[];
 for(const vv of vervar)for(const tv of turvar)for(const ty of tahun)for(const tt of turtahun){
   const key=`${vv.val}${vid}${tv.val}${ty.val}${tt.val}`;
   if(key in dc)rows.push({var_id:vid,variable:vlab,unit:unit,vervar_id:vv.val,vervar:clean(vv.label),turvar_id:tv.val,turvar:clean(tv.label),year_id:ty.val,year:clean(ty.label),period_id:tt.val,period:clean(tt.label),value:dc[key]});}
 return rows;}
function toCSV(rows){const e=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 return CSV_COLS.join(',')+'\n'+rows.map(r=>CSV_COLS.map(c=>e(r[c])).join(',')).join('\n');}
function download(name,text,type){const blob=new Blob(['﻿'+text],{type:type||'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

const TABS=[['subjects','Subjects'],['vars','Variables'],['years','Years & Export'],['pubs','Publications'],['static','Static Tables'],['settings','Settings']];
let cur='subjects';
function buildNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k==cur?'on':''}">${l}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));}
function show(k){cur=k;document.querySelectorAll('.view').forEach(v=>v.classList.add('hide'));$('#v-'+k).classList.remove('hide');
 buildNav();({subjects:loadSubjects,vars:loadVars,years:loadYears,pubs:loadPubs,static:loadStatic,settings:loadSettings}[k])();}
function stateBar(){$('#state').innerHTML=S.subject?`Subject <b>${S.subject}</b> — ${esc(S.subjectTitle)}`+(S.var?` &nbsp;|&nbsp; Variable <b>${S.var}</b> — ${esc(S.varTitle)}`:''):'No subject selected';}
function keyBanner(){$('#keybanner').innerHTML=getKey()?'':`<div class="banner">🔑 No API key set. This app needs a <b>free</b> BPS WebAPI key — each visitor uses their own, and it stays <b>only in your browser</b>. <a href="https://webapi.bps.go.id/developer/" target="_blank" rel="noopener">Get a free key ↗</a>, then paste it in the <b>Settings</b> tab.</div>`;}

// ---- Subjects
async function loadSubjects(){keyBanner();const el=$('#v-subjects');
 if(!getKey()){el.innerHTML='<div class="card">Paste your free BPS API key in the <b>Settings</b> tab to start.</div>';return;}
 if(!S.subjects.length){el.innerHTML='<div class="card">Loading subjects…</div>';
  try{S.subjects=(await apiList('subjectcsa')).map(r=>({id:r.sub_id,title:clean(r.title),subcat:clean(r.subcat)||'Lainnya',ntabel:r.ntabel}));}
  catch(e){el.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';return;}}
 el.innerHTML=`<div class="card"><div class="row"><input type="text" id="sq" placeholder="Search subjects…"><span class="muted" id="scount"></span></div></div><div id="subjlist"></div>`;
 $('#sq').oninput=e=>subjRows(e.target.value);subjRows('');$('#sq').focus();}
function subjRows(f){const q=(f||'').toLowerCase();
 const items=S.subjects.filter(s=>!q||(s.title||'').toLowerCase().includes(q)||String(s.id).includes(q));
 $('#scount').textContent=items.length+' of '+S.subjects.length;
 const cats={};items.forEach(s=>{(cats[s.subcat]=cats[s.subcat]||[]).push(s);});
 let h='';for(const c of Object.keys(cats).sort()){h+=`<div class="cat">${esc(c)}</div><div class="card" style="padding:6px"><table><tbody>`;
  cats[c].sort((a,b)=>a.id-b.id).forEach(s=>{h+=`<tr class="clk" data-id="${s.id}" data-t="${esc(s.title)}"><td style="width:80px"><span class="pill">${s.id}</span></td><td>${esc(s.title)}</td><td style="width:120px" class="muted">${s.ntabel!=null?s.ntabel+' tabel':''}</td></tr>`;});
  h+='</tbody></table></div>';}
 $('#subjlist').innerHTML=h;
 $('#subjlist').querySelectorAll('tr.clk').forEach(r=>r.onclick=()=>{S.subject=r.dataset.id;S.subjectTitle=r.dataset.t;S.var=null;S.vars=[];stateBar();show('vars');});}

// ---- Variables
async function loadVars(){const el=$('#v-vars');if(!S.subject){el.innerHTML='<div class="card">Pick a subject first (Subjects tab).</div>';return;}
 el.innerHTML='<div class="card">Loading variables…</div>';
 try{S.vars=(await apiList('var','subjectcsa/'+S.subject)).map(r=>({var_id:r.var_id,title:clean(r.title),unit:clean(r.unit||'')}));}
 catch(e){el.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';return;}
 el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">
    <div class="h2" style="margin:0">Variables · subject ${S.subject} — ${esc(S.subjectTitle)}</div>
    <button class="act" id="bdall">⬇ Download all ${S.vars.length} variables (CSV)</button></div>
  <div class="row" style="margin-top:8px"><input type="text" id="vq" placeholder="Search variables…"><span class="muted" id="vcount"></span></div>
  <div id="bulkprog" class="note"></div></div>
  <div class="scroll"><table><thead><tr><th style="width:80px">var</th><th>Title</th><th style="width:130px">Unit</th></tr></thead><tbody id="vtb"></tbody></table></div>`;
 $('#vq').oninput=e=>varRows(e.target.value);$('#bdall').onclick=bulkDownloadVars;varRows('');}
function varRows(f){const q=(f||'').toLowerCase();
 const items=S.vars.filter(v=>!q||(v.title||'').toLowerCase().includes(q)||String(v.var_id).includes(q));
 $('#vcount').textContent=items.length+' of '+S.vars.length;
 $('#vtb').innerHTML=items.map(v=>`<tr class="clk" data-id="${v.var_id}" data-t="${esc(v.title)}"><td><span class="pill">${v.var_id}</span></td><td>${esc(v.title)}</td><td class="muted">${esc(v.unit)}</td></tr>`).join('');
 $('#vtb').querySelectorAll('tr.clk').forEach(r=>r.onclick=()=>{S.var=r.dataset.id;S.varTitle=r.dataset.t;stateBar();show('years');});}
async function bulkDownloadVars(){if(!S.vars.length)return;
 if(!confirm('Export all '+S.vars.length+' variables (all available years) for subject '+S.subject+' into one CSV?\n\nThis runs in your browser, one request per variable/year — it can take a while for big subjects. Keep this tab open.'))return;
 const prog=$('#bulkprog');let all=[],done=0,fail=0;
 for(const v of S.vars){
   try{const ys=(await apiList('th','var/'+v.var_id)).map(y=>y.th_id);
     for(const th of ys){try{all=all.concat(decodeRows(await apiData(v.var_id,th)));}catch(e){fail++;}}}
   catch(e){fail++;}
   done++;prog.innerHTML=`Building CSV… ${done}/${S.vars.length} variables, ${all.length.toLocaleString()} rows so far${fail?', '+fail+' failed':''}`;
   await new Promise(r=>setTimeout(r,50));}
 if(!all.length){prog.textContent='No data returned.';return;}
 download('subject_'+S.subject+'_all.csv',toCSV(all));
 prog.innerHTML=`Done — ${all.length.toLocaleString()} rows downloaded${fail?', '+fail+' calls failed':''}.`;}

// ---- Years & Export
async function loadYears(){const el=$('#v-years');if(!S.var){el.innerHTML='<div class="card">Pick a variable first (Variables tab).</div>';return;}
 el.innerHTML='<div class="card">Loading periods…</div>';let ys;
 try{ys=await apiList('th','var/'+S.var);}catch(e){el.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';return;}
 el.innerHTML=`<div class="card"><div class="h2">Years & Export · var ${S.var} — ${esc(S.varTitle)}</div>
  <div class="row" style="margin-bottom:8px"><label class="muted">Periods:</label>
   <select id="ysel" multiple size="${Math.min(8,Math.max(3,ys.length))}" style="min-width:240px">
   ${ys.map(y=>`<option value="${y.th_id}">${esc(y.th)} (th=${y.th_id})</option>`).join('')}</select></div>
  <div class="note">Ctrl/Shift-click to select multiple, or tick "all years".</div>
  <div class="row" style="margin-top:12px">
   <button class="gho" id="bprev">Preview</button>
   <button class="act" id="bcsv">Download CSV</button>
   <label class="muted"><input type="checkbox" id="ball"> all years</label></div></div>
  <div id="prev"></div>`;
 const sel=()=>Array.from($('#ysel').selectedOptions).map(o=>o.value);
 $('#bprev').onclick=async()=>{const th=$('#ball').checked?ys.map(y=>y.th_id):sel();if(!th.length){alert('Select a period or tick all years.');return;}
  $('#prev').innerHTML='<div class="card">Loading preview…</div>';
  try{const rows=decodeRows(await apiData(S.var,th[0]));
   let t=`<div class="card"><div class="h2">Preview — ${rows.length.toLocaleString()} rows (first period, showing ${Math.min(rows.length,200)})</div><div class="scroll"><table><thead><tr>${CSV_COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
   rows.slice(0,200).forEach(r=>{t+='<tr>'+CSV_COLS.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>';});
   $('#prev').innerHTML=t+'</tbody></table></div></div>';}catch(e){$('#prev').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';}};
 $('#bcsv').onclick=async()=>{const th=$('#ball').checked?ys.map(y=>y.th_id):sel();if(!th.length){alert('Select at least one period.');return;}
  $('#prev').innerHTML='<div class="card">Building CSV…</div>';let all=[];
  try{for(const t of th)all=all.concat(decodeRows(await apiData(S.var,t)));
   download('data_var'+S.var+'.csv',toCSV(all));$('#prev').innerHTML=`<div class="card">Downloaded ${all.length.toLocaleString()} rows.</div>`;}
  catch(e){$('#prev').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';}};}

// ---- Publications
async function loadPubs(){const el=$('#v-pubs');if(!S.subject){el.innerHTML='<div class="card">Pick a subject first.</div>';return;}
 el.innerHTML='<div class="card">Loading publications…</div>';let pubs;
 try{pubs=(await apiList('publication','subjectcsa/'+S.subject)).map(r=>({title:clean(r.title),size:r.size||'',rl_date:r.rl_date||'',pdf:r.pdf||''}));}
 catch(e){el.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';return;}
 el.innerHTML=`<div class="card"><div class="h2">Publications (PDF) · subject ${S.subject} — ${esc(S.subjectTitle)}</div>
  <div class="row"><span class="pill">${pubs.length} PDFs</span><input type="text" id="pq" placeholder="Filter titles…"></div>
  <div class="note">Click a PDF link to download (opens in a new tab).</div></div>
  <div class="scroll"><table><thead><tr><th>Title</th><th style="width:90px">Size</th><th style="width:100px">Date</th><th style="width:70px"></th></tr></thead><tbody id="ptb"></tbody></table></div>`;
 const draw=f=>{const q=(f||'').toLowerCase();$('#ptb').innerHTML=pubs.filter(p=>!q||p.title.toLowerCase().includes(q)).map(p=>
   `<tr><td>${esc(p.title)}</td><td class="muted">${esc(p.size)}</td><td class="muted">${esc(p.rl_date)}</td><td>${p.pdf?`<a href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF</a>`:'—'}</td></tr>`).join('');};
 draw('');$('#pq').oninput=e=>draw(e.target.value);}

// ---- Static tables
async function loadStatic(){const el=$('#v-static');
 el.innerHTML=`<div class="card"><div class="h2">Static Tables (Excel)</div>
  <div class="row"><button class="gho" id="ballst">Load all static tables</button><input type="text" id="tq" placeholder="Filter titles…"></div>
  <div class="note">BPS's static-table subject filter is unreliable, so this lists all tables; use the filter box. Excel opens in a new tab.</div></div><div id="stb"></div>`;
 $('#ballst').onclick=async()=>{$('#stb').innerHTML='<div class="card">Loading… (fetches ~685 tables)</div>';
  try{const rows=(await apiList('statictable')).map(r=>({title:clean(r.title),subj:r.subj||'',size:r.size||'',excel:r.excel||''}));
   const draw=f=>{const q=(f||'').toLowerCase();$('#stb').innerHTML=`<div class="scroll"><table><thead><tr><th>Title</th><th style="width:160px">Subject</th><th style="width:80px">Size</th><th style="width:60px"></th></tr></thead><tbody>`+
     rows.filter(t=>!q||t.title.toLowerCase().includes(q)).map(t=>`<tr><td>${esc(t.title)}</td><td class="muted">${esc(t.subj)}</td><td class="muted">${esc(t.size)}</td><td>${t.excel?`<a href="${esc(t.excel)}" target="_blank" rel="noopener">xlsx</a>`:'—'}</td></tr>`).join('')+'</tbody></table></div>';};
   draw('');$('#tq').oninput=e=>draw(e.target.value);}catch(e){$('#stb').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>';}};}

// ---- Settings
function loadSettings(){keyBanner();const el=$('#v-settings');
 el.innerHTML=`<div class="card"><div class="h2">Settings</div>
  <div class="row" style="margin-bottom:10px"><label style="width:130px">Your BPS API key</label>
   <input type="password" id="sk" placeholder="${getKey()?'••••••••  (set — leave blank to keep)':'paste your free key'}" style="min-width:320px"></div>
  <div class="row" style="margin-bottom:10px"><label style="width:130px">Region (domain)</label>
   <input type="text" id="sd" value="${esc(DOMAIN())}" placeholder="0000 = national"></div>
  <div class="row" style="margin-bottom:10px"><label style="width:130px">Language</label>
   <select id="sl"><option value="ind" ${LANG()=='ind'?'selected':''}>Indonesian</option><option value="eng" ${LANG()=='eng'?'selected':''}>English</option></select></div>
  <div class="row"><button class="act" id="ssave">Save</button> <button class="gho" id="sclear">Clear key</button> <span id="smsg" class="muted"></span></div>
  <div class="note">🔒 Your key is stored only in <b>this browser</b> (localStorage) and sent directly to <code>webapi.bps.go.id</code>. It is never uploaded anywhere else and is not part of this website's code.</div>
  <div class="note">Don't have a key? <a href="https://webapi.bps.go.id/developer/" target="_blank" rel="noopener">Register free at webapi.bps.go.id ↗</a> (login → Profile → Applications → Add Application → copy the key).</div>
  <div class="note">Region 0000 = national. Province/regency domain codes (e.g. 3500 = Jawa Timur) pull that office's data.</div></div>`;
 $('#ssave').onclick=()=>{const k=$('#sk').value.trim();if(k)localStorage.setItem('bps_key',k);
  localStorage.setItem('bps_domain',($('#sd').value.trim()||'0000'));localStorage.setItem('bps_lang',$('#sl').value);
  S.subjects=[];S.vars=[];$('#smsg').textContent='Saved ✓';keyBanner();};
 $('#sclear').onclick=()=>{localStorage.removeItem('bps_key');S.subjects=[];S.vars=[];$('#sk').value='';$('#smsg').textContent='Key cleared';keyBanner();};}

buildNav();stateBar();keyBanner();
if(!getKey())show('settings');else show('subjects');
</script></body></html>
